<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Birthday Photoframe Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="shortcut icon" href="assets/icon.ico" type="image/x-icon">
</head>
<body>
    <div class="header">
        <img src="assets/logo.jpg" alt="Logo" />
    </div>

    <div class="container">
        <h1>Generate your birthday photoframe</h1>
        <input type="file" id="imageInput" accept="image/*" class="file-input" />
        <div class="content">
            <div id="image-container">
                <img id="image" />
            </div>
            <div id="cropped-image-container">
                <img id="photoFrame" src="assets/birthday-card.png" alt="Photo Frame" style="display: none;" />
            </div>
        </div>
        <button id="cropButton" style="display: none;">Generate Image with Frame</button>
        <a id="downloadButton" href="#" download="image_with_frame.png" style="display: none;" class="downloadBtn">Download Image with Frame</a>

    </div>

    <div class="footer" style="
        padding: 20px;
        text-align: center;
        background-color: transparent;
        color: #5d5d6c;
      ">
        <div style="margin: 0 auto;">
            <a style="display: inline-block; margin: 5px auto 10px;" href="#" target="_blank">
                <img src="assets/logo.jpg" style="
                    margin: 0 auto;
                    width: 220px;
                    display: block;
                  " alt="Company Footer Logo" />
            </a>
            <p style="
                  font-family: Arial, Helvetica, sans-serif;
                  font-size: 15px;
                  line-height: 20px;
                  margin: 0 auto;
                  padding-bottom: 20px;
                ">
                <span style="
                    display: block;
                    padding-bottom: 20px;
                    color: #ffffff;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 15px;
                    line-height: 20px;
                  ">
                    IEEE BUB, Inc., Qism Banha, Banha, Al-Qalyubia Governorate
                </span>
                <span style="display: block;">
                    <a href="https://ieee-bub.org" style="
                        color: #ffffff;
                        text-decoration: underline;
                        font-size: 15px;
                        line-height: 20px;
                      " target="_blank">ieee-bub.org</a>
                    &nbsp;&nbsp;&nbsp;&nbsp;
                    <a href="mailto:ieeebub.org" style="
                        color: #ffffff;
                        text-decoration: none;
                      " target="_blank">Contact Us</a>
                </span>
            </p>
            <div style="
                  margin: 0 auto;
                  padding: 15px 0 10px;
                  text-align: center;
                ">
                <a href="https://www.facebook.com/IEEE.BUB.SB" style="
                  margin: 0 15px;
                  display: inline-block;
                " target="_blank">
                    <img src="assets/facebook.png" style="
                      width: 27px;
                      display: block;filter: invert(1) brightness(10);
                    " alt="Facebook" />
                </a>
                <a href="https://www.linkedin.com/company/ieee-bub-sb/posts/?feedView=all" style="
                  margin: 0 15px;
                  display: inline-block;
                " target="_blank">
                    <img src="assets/linkedin.png" style="
                      width: 27px;
                      display: block;filter: invert(1) brightness(10);
                    " alt="LinkedIn" />
                </a>
                <a href="https://www.instagram.com/ieee.bub/" style="
                  margin: 0 15px;
                  display: inline-block;filter: invert(1) brightness(10);
                " target="_blank">
                    <img src="assets/instagram.png" style="
                      width: 27px;
                      display: block;
                    " alt="Instagram" />
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
